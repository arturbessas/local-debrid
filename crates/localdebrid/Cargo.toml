[package]
name = "localdebrid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted torrent-to-HTTP streaming server exposed as a Stremio addon"

[lib]
path = "src/lib.rs"

[[bin]]
name = "localdebrid"
path = "src/main.rs"

[dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
x509-parser = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1"
rand = "0.9"
futures = "0.3"
bytes = "1"
url = "2"
percent-encoding = "2"
if-addrs = "0.15"
libc = "0.2"
arc-swap = "1"
parking_lot = "0.12"
data-encoding = "2"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
localdebrid-testkit = { path = "../localdebrid-testkit" }
tempfile = "3"
rcgen = "0.14"
