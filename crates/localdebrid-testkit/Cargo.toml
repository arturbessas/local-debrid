[package]
name = "localdebrid-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Local BitTorrent swarm fixtures (tracker, seeder, upstream addon) for tests and the e2e script"

[[bin]]
name = "testkit"
path = "src/main.rs"

[dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
percent-encoding = "2"
data-encoding = "2"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
